<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClimaGlass | Weather App</title>
    <link rel="stylesheet" href="./css/style.css">
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="glass-container">
        <!-- Search Section -->
        <header class="search-box">
            <input type="text" id="city-input" placeholder="Enter city name (e.g. London)..." autocomplete="off">
            <button id="search-btn" aria-label="Search">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </header>

        <!-- Weather Main Information -->
        <main class="weather-content hide" id="weather-display">
            <div class="location-header">
                <h2 id="city-name" class="city-name">London, UK</h2>
                <p id="local-date" class="local-date">Monday, 14 Aug</p>
            </div>

            <div class="current-weather">
                <div class="icon-wrapper">
                    <img id="weather-icon" src="https://cdn-icons-png.flaticon.com/512/3222/3222800.png" alt="Weather Icon" class="floating-icon">
                </div>
                <div class="temp-wrapper">
                    <h1 id="temperature">22<span>°C</span></h1>
                    <p id="weather-condition" class="condition-text">Partly Cloudy</p>
                </div>
            </div>

            <!-- Metrics Grid -->
            <div class="metrics-grid">
                <div class="metric-card">
                    <div class="metric-icon"><i class="fa-solid fa-sunrise"></i></div>
                    <div class="metric-info">
                        <span class="metric-label">Sunrise</span>
                        <span class="metric-value" id="sunrise-time">06:12 AM</span>
                    </div>
                </div>
                <div class="metric-card">
                    <div class="metric-icon"><i class="fa-solid fa-sunset"></i></div>
                    <div class="metric-info">
                        <span class="metric-label">Sunset</span>
                        <span class="metric-value" id="sunset-time">08:45 PM</span>
                    </div>
                </div>
                <div class="metric-card">
                    <div class="metric-icon"><i class="fa-solid fa-droplet"></i></div>
                    <div class="metric-info">
                        <span class="metric-label">Humidity</span>
                        <span class="metric-value" id="humidity">65%</span>
                    </div>
                </div>
                <div class="metric-card">
                    <div class="metric-icon"><i class="fa-solid fa-wind"></i></div>
                    <div class="metric-info">
                        <span class="metric-label">Wind</span>
                        <span class="metric-value" id="wind-speed">18 km/h</span>
                    </div>
                </div>
            </div>
        </main>
        
        <!-- Welcome / Error State -->
        <div id="message-box" class="message-state">
            <i class="fa-solid fa-cloud-sun message-icon"></i>
            <p>Search for a city to see the magic happen.</p>
        </div>
    </div>

    <script src="./js/app.js"></script>
</body>
</html>
